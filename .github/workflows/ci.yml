name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: test_password
  SECRET_KEY: test_secret_key_for_ci

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_data_storage
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        cd backend
        uv sync --extra dev
    
    - name: Run linting
      run: |
        cd backend
        uv run black --check .
        uv run isort --check-only .
        uv run flake8 .
    
    - name: Run tests
      env:
        DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/test_data_storage"
        DATABASE_URL_ASYNC: "postgresql+asyncpg://postgres:test_password@localhost:5432/test_data_storage"
        REDIS_URL: "redis://localhost:6379"
        SECRET_KEY: "test_secret_key_for_ci"
        ENVIRONMENT: "testing"
      run: |
        cd backend
        uv run pytest --cov=app --cov-report=xml --cov-report=html -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build backend image
      run: |
        cd backend
        docker build -t data-storage-backend:latest .
    
    - name: Test Docker Compose
      run: |
        docker compose -f docker-compose.yml config

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
